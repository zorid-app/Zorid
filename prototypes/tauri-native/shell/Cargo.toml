[package]
name = "zorid-tauri-native-prototype"
version = "0.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
zorid-desktop-host = { path = "../../../crates/zorid-desktop-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync"] }

[profile.release]
opt-level = 3
debug = 0
strip = true
incremental = false
lto = false

[profile.dev]
debug = 0
incremental = false

[[bin]]
name = "zorid-native-host-comparator"
path = "src/stdio.rs"
