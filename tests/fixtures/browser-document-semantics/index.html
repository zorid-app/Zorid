<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared document semantics — browser proof</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; }
  body { margin: 2rem auto; padding: 0 1rem; max-width: 72rem; }
  h1 { font-size: 1.5rem; }
  button, input { font: inherit; }
  button { padding: .45rem .75rem; margin: .3rem .3rem .3rem 0; }
  dt { font-weight: 650; }
  dd { margin: 0 0 .75rem; overflow-wrap: anywhere; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; background: light-dark(#f1f3f5, #20242a); }
  #status { font-weight: 650; }
</style>
<h1>Shared document semantics — browser proof</h1>
<p>The worker invokes the generated Rust/WASM export for every canonical fixture. Expected values are used only for comparison.</p>
<p id="status" role="status" aria-live="polite">Ready</p>
<button id="run" type="button">Run corpus</button>
<button id="download-results" type="button" disabled>Download actual results</button>
<button id="download-report" type="button" disabled>Download report</button>
<dl id="facts"></dl>
<pre id="failures" aria-label="Failures">No run yet.</pre>
<script type="module" src="./harness.mjs"></script>
</html>
