[package]
name = "zorid-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Conservative native filesystem projection for Zorid's vault authority"

[dependencies]
zorid-index = { path = "../zorid-index" }
zorid-bases = { path = "../zorid-bases" }
zorid-records = { path = "../zorid-records" }
zorid-core = { path = "../zorid-core" }
zorid-store = { path = "../zorid-store" }
zorid-client-sync = { path = "../zorid-client-sync" }
zorid-sync-protocol = { path = "../zorid-sync-protocol" }
zorid-crypto = { path = "../zorid-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "ios", target_os = "android"))'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
