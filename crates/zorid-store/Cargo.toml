[package]
name = "zorid-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Transactional native persistence for Zorid's shared vault core"

[features]
# Explicit nondefault test trust; never enable in product dependency edges.
intent-test-fixtures = ["zorid-records/intent-test-fixtures"]

[dependencies]
zorid-records = { path = "../zorid-records" }
zorid-index = { path = "../zorid-index" }
zorid-core = { path = "../zorid-core" }
zorid-client-sync = { path = "../zorid-client-sync" }
zorid-file-sync = { path = "../zorid-file-sync" }
zorid-crypto = { path = "../zorid-crypto" }
zorid-sync-protocol = { path = "../zorid-sync-protocol" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
