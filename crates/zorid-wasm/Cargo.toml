[package]
name = "zorid-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zorid-core = { path = "../zorid-core" }
zorid-crdt = { path = "../zorid-crdt" }
zorid-crypto = { path = "../zorid-crypto", features = ["web"] }
zorid-sync-protocol = { path = "../zorid-sync-protocol" }
zeroize = "=1.9.1"
zorid-client-sync = { path = "../zorid-client-sync" }
zorid-file-sync = { path = "../zorid-file-sync" }
zorid-document = { path = "../zorid-document" }
