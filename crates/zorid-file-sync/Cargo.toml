[package]
name = "zorid-file-sync"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
zorid-client-sync = { path = "../zorid-client-sync" }
zorid-core = { path = "../zorid-core" }
zorid-sync-protocol = { path = "../zorid-sync-protocol" }
zorid-crypto = { path = "../zorid-crypto", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
