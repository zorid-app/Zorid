[package]
name = "zorid-sync-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Bounded opaque encrypted relay; local fixture service, not production enrollment"

[dependencies]
zorid-sync-protocol = { path = "../zorid-sync-protocol" }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
getrandom = "=0.4.3"
sha2 = "=0.11.0"
zeroize = "=1.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "=0.8.9"
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "sync", "io-util"] }
tower-http = { version = "=0.7.1", features = ["cors"] }
base64 = "=0.22.1"
tempfile = "3"

[dev-dependencies]
zorid-crypto = { path = "../zorid-crypto" }
tower = { version = "0.5", features = ["util"] }
