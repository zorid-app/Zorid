[package]
name = "zorid-index"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Portable derived index contracts and link resolution"

[dependencies]
regex = "=1.13.1"
zorid-core = { path = "../zorid-core" }
zorid-document = { path = "../zorid-document" }
unicode-normalization = "=0.1.25"
percent-encoding = "=2.3.2"
sha2 = "=0.11.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
