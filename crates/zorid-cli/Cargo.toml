[package]
name = "zorid-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Standalone headless access to Zorid's native vault core"

[[bin]]
name = "zorid"
path = "src/main.rs"

[dependencies]
zorid-core = { path = "../zorid-core" }
zorid-document = { path = "../zorid-document" }
zorid-native = { path = "../zorid-native" }
zorid-native-sync = { path = "../zorid-native-sync" }
zorid-store = { path = "../zorid-store" }
clap = { version = "4.6", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
zorid-file-sync = { path = "../zorid-file-sync" }
zorid-client-sync = { path = "../zorid-client-sync" }
zorid-sync-protocol = { path = "../zorid-sync-protocol" }
zorid-crypto = { path = "../zorid-crypto" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "=0.11.0"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
zeroize = "=1.9.1"
tempfile = "3"
zorid-sync-server = { path = "../zorid-sync-server" }
tokio = { version = "1", features = ["rt", "net", "sync"] }
axum = "=0.8.9"

prost = "=0.14.4"
http-body-util = "=0.1.5"
