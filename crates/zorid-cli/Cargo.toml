[package]
name = "zorid-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Standalone headless access to Zorid's native vault core"

[[bin]]
name = "zorid"
path = "src/main.rs"

[dependencies]
zorid-core = { path = "../zorid-core" }
zorid-native = { path = "../zorid-native" }
zorid-store = { path = "../zorid-store" }
clap = { version = "4.6", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
zorid-file-sync = { path = "../zorid-file-sync" }
zorid-client-sync = { path = "../zorid-client-sync" }
zorid-sync-protocol = { path = "../zorid-sync-protocol" }
zorid-crypto = { path = "../zorid-crypto" }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "=1.9.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
zorid-sync-server = { path = "../zorid-sync-server" }
tokio = { version = "1", features = ["rt", "net", "sync"] }
axum = "=0.8.9"
