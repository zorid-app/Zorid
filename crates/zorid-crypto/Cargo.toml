[package]
name = "zorid-crypto"
version = "0.1.0"
edition = "2021"
publish = false
autoexamples = false
license = "AGPL-3.0-only"

[features]
default = ["system-entropy"]
system-entropy = ["dep:getrandom"]
# Only the browser host enables this. No fake randomness on unsupported targets.
web = ["system-entropy", "getrandom/wasm_js"]

[dependencies]
zorid-sync-protocol = { path = "../zorid-sync-protocol" }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
getrandom = { version = "=0.4.3", optional = true }
zeroize = "=1.9.1"

[dev-dependencies]
serde_json = "1"

[[example]]
name = "crypto-interop"
path = "examples/interop.rs"
required-features = ["system-entropy"]
