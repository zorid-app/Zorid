name: Mobile iOS

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Unsigned simulator build, or signed device archive and TestFlight upload
        type: choice
        options: [build-only, upload]
        default: build-only
        required: true
      build_number:
        description: Unused increasing build number (1..9999); blank uses this workflow run number
        type: string
        required: false

permissions:
  contents: read

# Serialize uploads/build numbers; reruns require a fresh build_number after a successful upload.
concurrency:
  group: mobile-ios
  cancel-in-progress: false

jobs:
  ios:
    # Never deploy PR/untrusted refs. Environment must also restrict deployments to main.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    environment: ${{ inputs.operation == 'upload' && 'ios-testflight' || 'ios-build' }}
    env:
      IOS_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
      CARGO_BUILD_JOBS: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
          run_install: false
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Select official Rust iOS target
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          if [[ "$OPERATION" == upload ]]; then
            rustup target add aarch64-apple-ios
          else
            rustup target add aarch64-apple-ios-sim
          fi
          printf 'IOS_OUTPUT_DIR=%s/zorid-ios-output\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          xcodebuild -version
          rustc --version
      - name: Build unsigned arm64 simulator app
        if: inputs.operation == 'build-only'
        run: bash mobile/scripts/ios-build.sh simulator
      - name: Archive, export and upload to App Store Connect
        if: inputs.operation == 'upload'
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
        run: bash mobile/scripts/ios-release.sh upload
      - name: Package simulator app with permissions and symlinks
        if: inputs.operation == 'build-only'
        run: tar -czf "$IOS_OUTPUT_DIR/ios-simulator.tar.gz" -C "$IOS_OUTPUT_DIR/DerivedData/Build/Products/Debug-iphonesimulator" App.app
      - name: Preserve unsigned simulator build
        if: inputs.operation == 'build-only'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-${{ github.run_number }}
          path: ${{ runner.temp }}/zorid-ios-output/ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 7
      # Signed IPAs, archives and credentials are deliberately not uploaded as GitHub artifacts.
