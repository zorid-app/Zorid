name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: Validate version tag
        id: version
        run: node scripts/release/validate-version.mjs
      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          node scripts/release/check-new-release.mjs

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rust-target: aarch64-apple-darwin
            app: release/mac-arm64/Zorid.app
          - arch: x64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin
            app: release/mac/Zorid.app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      APP_PATH: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install and verify pinned Electron runtime
        run: pnpm run desktop:install "--${RELEASE_ARCH}"
      - name: Test and build
        run: |
          node --test --test-concurrency=2 tests/*.test.*
          pnpm run build:desktop
      - name: Build matching native Rust desktop host
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          case "$(uname -m):$RELEASE_ARCH" in
            arm64:arm64|x86_64:x64) ;;
            *) echo "Runner architecture does not match the requested release" >&2; exit 1 ;;
          esac
          rustup target add "$RUST_TARGET"
          cargo build --locked --release --target "$RUST_TARGET" -p zorid-desktop-host -j1
      - name: Import release signing credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: node scripts/release/macos-release.mjs prepare
      - name: Package signed application
        run: pnpm run package:mac "--${RELEASE_ARCH}" --dir
      - name: Notarize and staple application
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: node scripts/release/macos-release.mjs notarize-app "$APP_PATH"
      - name: Build signed drag-to-Applications DMG
        run: pnpm exec electron-builder --config electron-builder.cjs --mac dmg "--${RELEASE_ARCH}" --prepackaged "$APP_PATH" --publish never
      - name: Notarize, staple and verify distribution
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          DMG="release/Zorid-${RELEASE_VERSION}-${RELEASE_ARCH}.dmg"
          node scripts/release/macos-release.mjs notarize-dmg "$DMG"
          node scripts/release/macos-release.mjs verify-dmg "$DMG"
      - name: Remove temporary signing material
        if: ${{ always() }}
        run: node scripts/release/macos-release.mjs cleanup
      - name: Upload validated DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/Zorid-${{ needs.validate.outputs.version }}-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - name: Assemble release checksums and provenance
        run: node scripts/release/publish-macos.mjs prepare release-assets
      - name: Publish both architectures together
        run: node scripts/release/publish-macos.mjs publish release-assets
